<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GSC Test Dashboard</title>
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <style>
    :root {
      --bg: #0d1117;
      --panel: #161b22;
      --border: #30363d;
      --text: #e6edf3;
      --muted: #8b949e;
      --accent: #f0b400;          /* GSC yellow */
      --accent-hover: #ffce2e;
      --success: #2ea043;
      --error: #f85149;
      --running: #58a6ff;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      min-height: 100vh;
    }
    .container {
      max-width: 960px;
      margin: 0 auto;
      padding: 40px 24px;
    }
    header {
      display: flex;
      align-items: center;
      gap: 16px;
      margin-bottom: 32px;
      padding-bottom: 16px;
      border-bottom: 1px solid var(--border);
    }
    header h1 { margin: 0; font-size: 28px; }
    header .badge {
      background: var(--accent);
      color: #000;
      padding: 4px 10px;
      border-radius: 12px;
      font-size: 12px;
      font-weight: 700;
    }
    .summary {
      display: flex;
      gap: 16px;
      margin-bottom: 24px;
    }
    .summary .stat {
      background: var(--panel);
      border: 1px solid var(--border);
      padding: 12px 18px;
      border-radius: 8px;
      flex: 1;
    }
    .summary .stat .num {
      font-size: 24px;
      font-weight: 700;
    }
    .summary .stat .label {
      font-size: 12px;
      color: var(--muted);
      text-transform: uppercase;
    }
    .test-card {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 20px 24px;
      margin-bottom: 16px;
      display: flex;
      align-items: center;
      gap: 16px;
    }
    .test-card .info { flex: 1; }
    .test-card h2 { margin: 0 0 4px 0; font-size: 18px; }
    .test-card p { margin: 0; color: var(--muted); font-size: 14px; }
    .status {
      padding: 4px 12px;
      border-radius: 16px;
      font-size: 12px;
      font-weight: 700;
      text-transform: uppercase;
    }
    .status.idle    { background: #21262d; color: var(--muted); }
    .status.running { background: rgba(88,166,255,0.2); color: var(--running); }
    .status.passed  { background: rgba(46,160,67,0.2); color: var(--success); }
    .status.failed  { background: rgba(248,81,73,0.2); color: var(--error); }
    button {
      background: var(--accent);
      color: #000;
      border: none;
      padding: 10px 20px;
      border-radius: 8px;
      font-weight: 700;
      cursor: pointer;
      transition: background 120ms;
    }
    button:hover:not(:disabled) { background: var(--accent-hover); }
    button:disabled { opacity: 0.5; cursor: not-allowed; }
    .output {
      margin-top: 8px;
      background: #000;
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 12px;
      font-family: "Cascadia Code", "Fira Code", Consolas, monospace;
      font-size: 12px;
      max-height: 200px;
      overflow-y: auto;
      white-space: pre-wrap;
      color: #c9d1d9;
    }
    .meta { font-size: 12px; color: var(--muted); margin-top: 6px; }
    .toolbar {
      display: flex;
      gap: 12px;
      margin-bottom: 24px;
    }
    .toolbar button.secondary {
      background: var(--panel);
      color: var(--text);
      border: 1px solid var(--border);
    }
  </style>
</head>
<body>
  <div id="root"></div>
  <script type="text/babel" src="app.js"></script>
</body>
</html>
